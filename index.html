<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b3a62">
  <title>暈船啦！</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <header>
    <div class="version">暈船啦！・VERSION 2.0</div>
    <h1>暈船啦！</h1>
    <button id="homeBtn" class="small-btn">模式首頁</button>
  </header>

  <!-- 模式選擇 -->
  <section id="modeScreen">

    <h2>選擇遊戲模式</h2>

    <button class="mode-btn" data-mode="boy">
      <span class="emoji">😎</span>
      <span>
        <b>男生模式</b>
        <small>從認識、聊天一路發展關係</small>
      </span>
    </button>

    <button class="mode-btn" data-mode="girl">
      <span class="emoji">💄</span>
      <span>
        <b>女生模式</b>
        <small>觀察意圖、回應與表達界線</small>
      </span>
    </button>

    <button class="mode-btn" data-mode="free">
      <span class="emoji">🎭</span>
      <span>
        <b>自由模式</b>
        <small>不限制性別，專注互動判斷</small>
      </span>
    </button>

  </section>

  <!-- 角色選擇 -->
  <section id="characterScreen" class="hidden">

    <h2>選擇故事角色</h2>

    <div id="characterList"></div>

  </section>

  <!-- 遊戲畫面 -->
  <section id="gameScreen" class="hidden">

    <div id="characterInfo"></div>

    <div class="score-box">
      ❤️ 好感 <b id="affection">0</b>
      🤝 信任 <b id="trust">0</b>
      ✨ 心動 <b id="spark">0</b>
    </div>

    <div class="story-box">

      <h2 id="storyTitle"></h2>

      <p id="storyText"></p>

      <div id="choices"></div>

    </div>

    <div id="replyBox" class="reply-box hidden"></div>

  </section>

  <footer>
    互動結果是情境模擬，不代表特定性別或個性一定會如此反應。<br>
    明確拒絕應被尊重。
  </footer>

</main>

<script src="scenarios.js"></script>
<script src="game.js"></script>

</body>
</html>
