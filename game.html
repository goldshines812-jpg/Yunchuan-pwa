<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暈船啦！戀愛互動</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <div>暈船啦！・VERSION 3.1</div>
    <h1>戀愛互動</h1>
  </header>

  <main>

    <h2 id="characterName">正在載入角色...</h2>

    <p>
      好感度 ❤️
      <strong id="score">50</strong>
    </p>

    <div id="story"></div>

    <br>

    <div id="choices">

      <button id="choiceA" type="button"></button>

      <br><br>

      <button id="choiceB" type="button"></button>

      <br><br>

      <button id="choiceC" type="button"></button>

    </div>

    <br><br>

    <button type="button" onclick="location.href='index.html'">
      回到模式首頁
    </button>

  </main>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const character = params.get("character") || "神秘角色";

document.getElementById("characterName").textContent =
  "你正在和 " + character + " 約會";

let score = 50;
let round = 0;

const questions = [

  {
    story: "第一次見面，對方微笑著看著你。你會怎麼做？",
    choices: [
      { text: "A. 主動跟對方打招呼 😊", points: 10 },
      { text: "B. 害羞地笑一下 😳", points: 5 },
      { text: "C. 假裝沒看到 😐", points: -10 }
    ]
  },

  {
    story: "對方問你：平常休假最喜歡做什麼？",
    choices: [
      { text: "A. 認真分享自己的興趣 🎵", points: 10 },
      { text: "B. 反問對方喜歡做什麼 ☕", points: 8 },
      { text: "C. 隨便啦，都可以 😶", points: -5 }
    ]
  },

  {
    story: "聊天時，對方突然問：你現在有喜歡的人嗎？",
    choices: [
      { text: "A. 笑著說：可能就在我面前 ❤️", points: 15 },
      { text: "B. 說目前還沒有 😊", points: 5 },
      { text: "C. 說這是秘密 🙈", points: 0 }
    ]
  },

  {
    story: "約會快結束了，對方問：下次還可以再見面嗎？",
    choices: [
      { text: "A. 當然，我也很期待 💗", points: 15 },
      { text: "B. 有機會可以啊 🙂", points: 5 },
      { text: "C. 最近應該都很忙 😅", points: -10 }
    ]
  }

];

const storyBox = document.getElementById("story");
const choiceA = document.getElementById("choiceA");
const choiceB = document.getElementById("choiceB");
const choiceC = document.getElementById("choiceC");

function showQuestion() {

  const q = questions[round];

  storyBox.textContent = q.story;

  choiceA.textContent = q.choices[0].text;
  choiceB.textContent = q.choices[1].text;
  choiceC.textContent = q.choices[2].text;

  choiceA.onclick = function() {
    choose(q.choices[0].points);
  };

  choiceB.onclick = function() {
    choose(q.choices[1].points);
  };

  choiceC.onclick = function() {
    choose(q.choices[2].points);
  };

}

function choose(points) {

  score = score + points;

  if (score > 100) {
    score = 100;
  }

  if (score < 0) {
    score = 0;
  }

  document.getElementById("score").textContent = score;

  round++;

  if (round < questions.length) {
    showQuestion();
  } else {
    showEnding();
  }

}

function showEnding() {

  document.getElementById("choices").style.display = "none";

  if (score >= 80) {

    storyBox.textContent =
      "💗 完美結局：你們對彼此都有好感，決定正式開始約會！";

  } else if (score >= 55) {

    storyBox.textContent =
      "💕 曖昧結局：你們交換了訊息，決定繼續認識彼此。";

  } else {

    storyBox.textContent =
      "💔 朋友結局：這次沒有擦出愛情火花，但你們留下了一段回憶。";

  }

}

showQuestion();

</script>

</body>
</html>
