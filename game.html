<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暈船啦！戀愛互動</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <div>暈船啦！・VERSION 3.0</div>
    <h1>戀愛互動</h1>
  </header>

  <main>

    <h2 id="characterName">正在載入角色...</h2>

    <p>
      好感度 ❤️
      <strong id="score">50</strong>
    </p>

    <div id="story">
      你們第一次見面，對方微笑著看著你。
    </div>

    <br>

    <div id="choices">

      <button type="button" onclick="choose(10)">
        A. 主動跟對方打招呼 😊
      </button>

      <br><br>

      <button type="button" onclick="choose(5)">
        B. 害羞地笑一下 😳
      </button>

      <br><br>

      <button type="button" onclick="choose(-10)">
        C. 假裝沒看到 😐
      </button>

    </div>

    <br><br>

    <button type="button" onclick="location.href='index.html'">
      回到模式首頁
    </button>

  </main>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const character = params.get("character") || "神秘角色";

document.getElementById("characterName").textContent =
  "你正在和 " + character + " 約會";

let score = 50;
let round = 0;

const stories = [
  "對方問你：平常休假喜歡做什麼？",
  "聊天聊了一會兒，對方突然問：你現在有喜歡的人嗎？",
  "約會快結束了，對方看著你問：下次還可以再見面嗎？"
];

function choose(points) {

  score = score + points;

  if (score > 100) {
    score = 100;
  }

  if (score < 0) {
    score = 0;
  }

  document.getElementById("score").textContent = score;

  if (round < stories.length) {

    document.getElementById("story").textContent =
      stories[round];

    round++;

  } else {

    showEnding();

  }

}

function showEnding() {

  const story = document.getElementById("story");
  const choices = document.getElementById("choices");

  choices.style.display = "none";

  if (score >= 80) {

    story.textContent =
      "💗 完美結局：你們對彼此都有好感，新的戀愛故事正式開始！";

  } else if (score >= 50) {

    story.textContent =
      "💕 曖昧結局：你們決定繼續聯絡，看看未來會發生什麼。";

  } else {

    story.textContent =
      "💔 朋友結局：這次沒有擦出愛情火花，但也許你們更適合當朋友。";

  }

}

</script>

</body>
</html>
